[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matteuslee-gpuops_jd051"
version = "0.1.0"
description = "从输入中抽取数值，计算GPU 集群运维工程师·存储 IO 与计算的重叠相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "matteuslee" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://matteuslee.github.io"
Repository = "https://github.com/matteuslee/gpuops_jd051"
Issues = "https://github.com/matteuslee/gpuops_jd051/issues"

[project.scripts]
gpuops_jd051 = "gpuops_jd051:main"

[tool.setuptools]
py-modules = ["gpuops_jd051"]
